apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-morphcloud
  labels:
    app.kubernetes.io/name: morphcloud
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: morphcloud
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: morphcloud
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: morphcloud
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "morphcloud.serving.server"]
          args:
            - "--model"
            - {{ .Values.server.model | quote }}
            - "--checkpoint-backend"
            - {{ .Values.server.checkpointBackend | quote }}
            - "--checkpoint-path"
            - {{ .Values.server.checkpointPath | quote }}
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
