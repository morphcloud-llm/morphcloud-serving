name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pytest==8.2.2 scikit-learn==1.4.2 xgboost==2.0.3 imbalanced-learn==0.12.3 joblib==1.4.2 fastapi==0.111.0 uvicorn==0.30.1
      - name: Compile Python sources
        run: python -m compileall -q morphcloud scripts evaluation tests
      - name: Run tests
        run: pytest -q
